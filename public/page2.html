<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAMA Money Mali - Demande de Prêt</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            /* Couleurs officielles de l'application SAMA Money (Mali) */
            --sama-blue: #0055A5;          /* Bleu principal SAMA Money */
            --sama-blue-dark: #003E7E;     /* Bleu foncé au survol/clic */
            --sama-navy: #0A2540;          /* Bleu nuit pour les titres/accents */
            --sama-gold: #F5A623;          /* Jaune/Or signature SAMA Money */
            --bg-color: #F4F7FA;           /* Fond gris-bleu très clair */
            --card-bg: #FFFFFF;
            --text-main: #0A2540;
            --text-muted: #5A6B7C;
            --input-border: #C5DDF5;
            --input-focus: #0055A5;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Barre de navigation supérieure - Bleu SAMA Money */
        .app-header {
            width: 100%;
            background: linear-gradient(135deg, var(--sama-blue) 0%, var(--sama-blue-dark) 100%);
            height: 62px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 10px rgba(0, 85, 165, 0.2);
            border-bottom: 3px solid var(--sama-gold);
        }

        .back-btn {
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            font-size: 21px;
            font-weight: 900;
            letter-spacing: 0.3px;
            color: #ffffff;
        }

        .header-title .brand-sama {
            color: #ffffff;
        }

        .header-title .brand-money {
            color: var(--sama-gold);
            margin-left: 4px;
        }

        .header-title .region {
            color: var(--sama-navy);
            font-size: 11px;
            margin-left: 6px;
            font-weight: 800;
            text-transform: uppercase;
            background: var(--sama-gold);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .menu-icon {
            font-size: 24px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu-icon span {
            display: block;
            width: 22px;
            height: 3px;
            background-color: #ffffff;
            border-radius: 2px;
        }

        /* Carte principale */
        .card {
            background: var(--card-bg);
            width: 90%;
            max-width: 440px;
            margin: 20px 0 30px;
            padding: 32px 24px;
            border-radius: 20px;
            box-shadow: 0 6px 25px rgba(10, 37, 64, 0.07);
            border: 1px solid #E3ECF5;
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-size: 25px;
            color: var(--text-main);
            margin: 0 0 6px;
            text-align: center;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .subtext {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 24px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Barre de progression des étapes */
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 0 auto 32px;
            width: 100%;
        }

        .step-bar {
            flex: 1;
            height: 6px;
            background-color: #D6E4F0;
            border-radius: 3px;
        }

        .step-bar.active {
            background: linear-gradient(90deg, var(--sama-blue), var(--sama-gold));
        }

        /* Champs du formulaire */
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 700;
            color: var(--sama-navy);
            margin-bottom: 8px;
        }

        .form-control {
            font-size: 15px;
            padding: 14px 16px;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            background-color: #ffffff;
            color: #0A2540;
            outline: none;
            width: 100%;
            transition: border-color 0.2s;
        }

        .form-control::placeholder {
            color: #8FA3BE;
        }

        .form-control:focus {
            border-color: var(--sama-blue);
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230055A5' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 14px;
            padding-right: 40px;
            cursor: pointer;
        }

        textarea.form-control {
            resize: none;
            height: 95px;
            font-family: inherit;
        }

        /* Bouton d'action principal - Bleu & Or SAMA Money */
        .btn-next {
            background: linear-gradient(135deg, var(--sama-blue) 0%, var(--sama-blue-dark) 100%);
            color: #ffffff;
            border: none;
            border-bottom: 3px solid var(--sama-gold);
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 0.5px;
            margin-top: 10px;
            text-transform: uppercase;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(0, 85, 165, 0.3);
        }

        .btn-next:active {
            background: var(--sama-blue-dark);
            transform: scale(0.99);
        }

        /* Pied de page */
        .footer-banner {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: auto;
        }
    </style>
</head>

<body>

<!-- Barre de navigation supérieure SAMA Money -->
<div class="app-header">
    <a href="/" class="back-btn">← Retour</a>
    <div class="header-title">
        <span class="brand-sama">SAMA</span><span class="brand-money">Money</span><span class="region">Mali</span>
    </div>
    <div class="menu-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

<div class="card">
    <h1 class="main-title">Demande de Prêt</h1>
    <div class="subtext">Étape 1 sur 3</div>

    <!-- Indicateurs de progression -->
    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar"></div>
        <div class="step-bar"></div>
    </div>

    <!-- Formulaire de demande -->
    <form id="loanForm" onsubmit="submitStep1(event)">
        <div class="form-group">
            <label for="loanType">Type de Prêt</label>
            <select id="loanType" class="form-control" required>
                <option value="Prêt Personnel" selected>Prêt Personnel</option>
                <option value="Prêt Professionnel">Prêt Professionnel</option>
                <option value="Prêt Éducation">Prêt Éducation</option>
                <option value="Prêt Urgent">Prêt Urgent</option>
            </select>
        </div>

        <div class="form-group">
            <label for="loanAmt">Montant du Prêt (FCFA)</label>
            <input type="number" id="loanAmt" class="form-control" placeholder="250000" value="250000" required>
        </div>

        <div class="form-group">
            <label for="loanTerm">Durée du Prêt</label>
            <select id="loanTerm" class="form-control" required>
                <option value="6 Mois">6 Mois</option>
                <option value="12 Mois" selected>12 Mois</option>
                <option value="18 Mois">18 Mois</option>
                <option value="24 Mois">24 Mois</option>
                <option value="36 Mois">36 Mois</option>
                <option value="48 Mois">48 Mois</option>
                <option value="60 Mois">60 Mois</option>
            </select>
        </div>

        <div class="form-group">
            <label for="loanPurpose">Motif du Prêt</label>
            <textarea id="loanPurpose" class="form-control" placeholder="À quoi servira ce prêt ?" required></textarea>
        </div>

        <button type="submit" class="btn-next">SUIVANT</button>
    </form>
</div>

<!-- Pied de page -->
<div class="footer-banner">
    © 2026 SAMA Money - Mali
</div>

<script>
    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Récupération des calculs enregistrés de l'étape précédente si disponibles
        const savedAmount = localStorage.getItem('loan_amount') || localStorage.getItem('amount') || localStorage.getItem('appliedAmount');
        const savedDuration = localStorage.getItem('loan_term') || localStorage.getItem('loanDuration') || localStorage.getItem('duration');

        if (savedAmount) {
            const digitsOnly = savedAmount.toString().replace(/\D/g, '');
            if (digitsOnly) {
                document.getElementById('loanAmt').value = digitsOnly;
            }
        }

        if (savedDuration) {
            const formattedDuration = savedDuration.toString().trim().toLowerCase();
            const selectEl = document.getElementById('loanTerm');
            
            for (let i = 0; i < selectEl.options.length; i++) {
                if (selectEl.options[i].value.toLowerCase().includes(formattedDuration) || formattedDuration.includes(selectEl.options[i].value.toLowerCase().replace(/\D/g, ''))) {
                    selectEl.selectedIndex = i;
                    break;
                }
            }
        }
    };

    function submitStep1(event) {
        event.preventDefault();

        const loanType = document.getElementById('loanType').value;
        const loanAmt = Number(document.getElementById('loanAmt').value) || 0;
        const loanTermVal = document.getElementById('loanTerm').value;
        const loanPurpose = document.getElementById('loanPurpose').value;

        // Analyse du nombre de mois (ex: "12 Mois" -> 12)
        const months = Number(loanTermVal.replace(/\D/g, '')) || 12;

        // Calcul du remboursement mensuel avec un taux d'intérêt annuel de 5 %
        const annualRate = 0.05;
        const totalInterest = loanAmt * annualRate * (months / 12);
        const monthlyPayment = Math.round((loanAmt + totalInterest) / months);

        // Sauvegarde dans le stockage local sous différentes clés pour compatibilité
        localStorage.setItem('loan_amount', loanAmt);
        localStorage.setItem('amount', loanAmt);
        localStorage.setItem('appliedAmount', loanAmt);

        localStorage.setItem('loan_term', months);
        localStorage.setItem('duration', months);
        localStorage.setItem('appliedTerm', loanTermVal);

        localStorage.setItem('monthly_repayment', monthlyPayment);
        localStorage.setItem('appliedLoanType', loanType);
        localStorage.setItem('appliedPurpose', loanPurpose);

        // Transition vers la page 2 (ou l'étape suivante)
        window.location.href = "/page3"; 
    }
</script>

</body>
</html>
